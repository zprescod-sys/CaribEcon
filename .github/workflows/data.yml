name: Refresh economic data

# Monthly re-pull of the comparable macro spine (World Bank WDI) into
# data/almanac-data.json, plus a drift check of the hand-keyed primary records.
# Unlike the news cron, this does NOT push to main — it opens a pull request so the
# refreshed data can be reviewed before it deploys (Vercel deploys only from main).
#
# World-Bank-only: the IMF DataMapper API blocks GitHub-runner IPs behind a bot-WAF and
# its terms discourage bulk automated pulls. The IMF-sourced records (debt, fiscal
# balance, current account, four inflation series) are hand-maintained from the
# April/October WEO releases — see scripts/refresh-data.mjs.
#
# The World Bank revises on a rolling basis rather than a fixed release calendar, so
# monthly keeps the data current without churn; workflow_dispatch allows a manual run
# from the Actions tab.
on:
  schedule:
    - cron: '0 6 1 * *'   # 1st of each month, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write        # push the automated branch
  pull-requests: write   # open/update the PR

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - run: npm ci

      - name: Refresh comparable series (World Bank)
        run: npm run data:refresh

      - name: Check primary-source drift
        run: npm run data:drift

      - name: Validate dataset against schema
        run: npm run data:validate

      - name: Verify the site still builds with the new data
        run: npm run build

      - name: Open / update the review pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: automated/data-refresh
          delete-branch: true
          commit-message: "chore(data): monthly economic data refresh"
          title: "chore(data): monthly economic data refresh"
          add-paths: |
            data/almanac-data.json
            audit/primary-drift.md
            audit/primary-drift.json
          body: |
            Automated monthly refresh of the comparable macro spine from the live
            **World Bank WDI** API. Primary (hand-keyed national-source) records are left
            untouched.

            **Not included:** the IMF WEO series — general-government debt, fiscal balance,
            current account, and four inflation series the World Bank does not cover
            cleanly — are **maintained by hand** from the April/October WEO releases. The
            IMF API blocks CI runners and its terms discourage bulk automated pulls, so
            this pipeline never fetches it. Those records are skipped, not stale-refreshed.

            **Review before merging:**
            - `data/almanac-data.json` — the refreshed comparable series (Files changed).
            - `audit/primary-drift.md` — ⚠ primary records that now diverge from the World
              Bank and may need a manual update from the national source. These are
              **flagged only**, never changed automatically.

            Merging this PR deploys the updated data (Vercel builds from `main`). Closing
            it discards the refresh; the next monthly run will reopen a fresh one.
