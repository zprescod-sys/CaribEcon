name: Refresh news feeds

# Twice-daily publish cadence. The feeds are polled at run time and merged into
# data/news.json; the commit triggers the host's auto-deploy. Two runs because
# the highest-volume feeds (Kaieteur, WIC News) post ~25-30 items/day against
# 25-30-item feed windows — a 21h gap can let same-day items scroll off unseen;
# a 12h gap keeps every feed safely inside its window. workflow_dispatch
# allows a manual refresh from the Actions tab.
on:
  schedule:
    - cron: '17 11 * * *'   # 11:17 UTC ≈ 7:17am Caribbean
    - cron: '17 23 * * *'   # 23:17 UTC ≈ 7:17pm Caribbean
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: feeds
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - run: npm ci

      - name: Fetch & merge feeds
        run: npm run feeds
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Verify the site still builds with today's data
        run: npm run build

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/news.json data/news_unclassified.json data/publications.json data/pub_inbox.json data/deals.json data/deals_inbox.json
          if git diff --staged --quiet; then
            echo "No feed changes."
          else
            git commit -m "chore(data): daily feed refresh"
            git push
          fi
