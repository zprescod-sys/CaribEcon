name: Refresh news feeds

# Daily publish cadence. The feeds are polled at run time and merged into
# data/news.json; the commit triggers the host's auto-deploy. workflow_dispatch
# allows a manual refresh from the Actions tab.
on:
  schedule:
    - cron: '0 11 * * *'   # 11:00 UTC ≈ 7am Caribbean, daily
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: feeds
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Fetch & merge feeds
        run: npm run feeds

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/news.json data/publications.json data/pub_inbox.json
          if git diff --staged --quiet; then
            echo "No feed changes."
          else
            git commit -m "chore(data): daily feed refresh"
            git push
          fi
