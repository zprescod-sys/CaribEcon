name: CI

# Guards every push/PR with a typecheck + test + build, so a broken commit is
# caught here instead of surfacing as a failed Cloudflare Pages deploy (or,
# worse, a daily feeds-cron commit nobody is watching).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - run: npm ci
      # Full scope, dev dependencies included. This was briefly narrowed to --omit=dev to
      # work around the vercel CLI's bundled @vercel/* builders (Python, Rust, Remix,
      # Gatsby...), whose transitive deps carried unfixable advisories on every CLI version.
      # That dependency is gone — run it locally with `npx vercel@58 dev` — so the stricter
      # gate is back and the tree audits clean.
      - run: npm audit --audit-level=high
      - run: npm run test
      - run: npm run check
      - run: npm run build
