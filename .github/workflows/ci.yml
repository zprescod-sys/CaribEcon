name: CI

# Guards every push/PR with a typecheck + test + build, so a broken commit is
# caught here instead of surfacing as a failed Cloudflare Pages deploy (or,
# worse, a daily feeds-cron commit nobody is watching).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run test
      - run: npm run check
      - run: npm run build
