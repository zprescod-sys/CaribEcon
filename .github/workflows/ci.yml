name: CI

# Guards every push/PR with a typecheck + test + build, so a broken commit is
# caught here instead of surfacing as a failed Cloudflare Pages deploy (or,
# worse, a daily feeds-cron commit nobody is watching).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - run: npm ci
      # --omit=dev: gate on what actually ships to production, not on devDependency tooling
      # (e.g. the vercel CLI bundles many @vercel/* builder packages — Python, Rust, Remix,
      # Gatsby, etc. — whose own transitive deps carry advisories no matter which vercel
      # version is pinned; none of that code runs in production or even in this CI job).
      - run: npm audit --audit-level=high --omit=dev
      - run: npm run test
      - run: npm run check
      - run: npm run build
